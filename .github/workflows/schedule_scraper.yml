name: Daily Theater Schedule Scraper

on:
  schedule:
    # Runs at 15:00 UTC every day (which is 00:00 JST/KST)
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Schedule Scraper
        run: |
          python schedule_scraper.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schedules/
          if git diff --staged --quiet; then
            echo "No schedule changes detected."
          else
            git commit -m "chore: auto-update theater schedule [skip ci]"
            git push
          fi
